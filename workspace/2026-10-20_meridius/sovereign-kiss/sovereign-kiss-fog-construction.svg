<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-labelledby="title desc">
<title id="title">Sovereign Kiss — pink fog construction and passage</title><desc id="desc">Editable Blender reference: dense pink heart passes through targets, loses density and evaporates. Proposed scale, materials, timing and ownership.</desc>
<defs>
<radialGradient id="pink"><stop stop-color="#ffe3f1"/><stop offset=".3" stop-color="#ff82c2"/><stop offset=".7" stop-color="#f44c9d"/><stop offset="1" stop-color="#c82777" stop-opacity=".1"/></radialGradient>
<linearGradient id="body" x2="1" y2="1"><stop stop-color="#ffc0df"/><stop offset=".5" stop-color="#f44c9d"/><stop offset="1" stop-color="#c82777" stop-opacity=".4"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#9f7596" stroke-opacity=".06"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#f4afd2" stroke-width="1.5"/></marker>
<path id="heart" d="M0 82C-30 56-100 5-100-42C-100-99-28-112 0-60C28-112 100-99 100-42C100 5 30 56 0 82Z"/>
<g id="fog"><use href="#heart" fill="url(#body)" opacity=".75" filter="url(#soft)"/><g fill="url(#pink)" opacity=".35"><ellipse cx="-57" cy="-43" rx="58" ry="52"/><ellipse cx="53" cy="-44" rx="61" ry="54"/><ellipse cy="10" rx="64" ry="62"/><ellipse cx="-20" cy="43" rx="34" ry="30"/></g><path d="M-86-42C-72-83-37-71-18-38M21-26C40-71 77-68 88-34M-45 10C-9 1 31 28 5 60" fill="none" stroke="#ffe3f1" stroke-opacity=".55" stroke-width="6" filter="url(#soft)"/></g>
<g id="wisps" fill="none" stroke="#ff9acb" stroke-linecap="round"><path d="M-100-40C-65-80-13-11 18-40S77-70 116-30" stroke-width="20" opacity=".4" filter="url(#soft)"/><path d="M-76 11C-36-16-10 52 41 28S95 2 127 23" stroke-width="15" opacity=".3" filter="url(#soft)"/><path d="M-30 62C0 38 22 85 68 65" stroke-width="11" opacity=".23" filter="url(#soft)"/></g>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#f5eaf3}.title{font-family:Georgia,serif;font-size:47px;letter-spacing:3px;fill:#ffc0df}.sub{font-size:18px;letter-spacing:2px;fill:#d6adc9}.head{font-size:23px;font-weight:600}.label{font-size:19px;fill:#e1bad3}.note{font-size:17px;fill:#baa0b5}.small{font-size:15px;fill:#baa0b5}.pink{fill:#ffacd5}.panel{fill:#1c1724;stroke:#554152}.rule{fill:none;stroke:#ec9fc4;stroke-width:1.3}.guide{fill:none;stroke:#8d6a87;stroke-dasharray:5 6}</style>
</defs>
<rect width="1800" height="1400" fill="#120f19"/><rect width="1800" height="1400" fill="url(#grid)"/>
<text x="56" y="70" class="title">SOVEREIGN KISS / PINK FOG</text><text x="58" y="106" class="sub">BLENDER CONSTRUCTION · SUCCUBUS–GERMAN SQUAD</text><text x="1742" y="70" text-anchor="end" class="sub">02 / TECHNICAL SHEET</text><text x="1742" y="106" text-anchor="end" class="note">Z up · front −Y · 30 fps · proposed controls</text><path d="M56 127H1744" class="rule"/>

<rect x="56" y="154" width="1688" height="350" rx="12" class="panel"/><text x="80" y="195" class="head">01 / ONE HEART — CONTINUOUS PASSAGE</text><text x="1720" y="195" text-anchor="end" class="note">Overlap enthralls; the fog keeps travelling.</text>
<g transform="translate(263 327) scale(.95)"><use href="#fog"/></g>
<g transform="translate(680 320)"><path d="M-35-69L0-84L35-69L28-24L0-12L-28-24ZM-44-8L0-23L44-8L61 70L-61 70Z" fill="#546075" stroke="#a2acba" stroke-width="2"/><use href="#fog" opacity=".58" transform="scale(1.07)"/></g>
<g transform="translate(1092 322) scale(1.16)"><use href="#fog" opacity=".22"/><use href="#wisps"/></g>
<g transform="translate(1514 320) scale(1.27)"><use href="#wisps" opacity=".3"/></g>
<path d="M394 321H505M811 321H930M1225 321H1345" class="rule" marker-end="url(#arrow)"/>
<text x="263" y="444" text-anchor="middle" class="label pink">DENSE RELEASE</text><text x="263" y="476" text-anchor="middle" class="small">Clear lobes, cleft and point</text>
<text x="680" y="444" text-anchor="middle" class="label pink">THROUGH OPPONENTS</text><text x="680" y="476" text-anchor="middle" class="small">Armor visible through vapor</text>
<text x="1092" y="444" text-anchor="middle" class="label pink">BEYOND THE FORMATION</text><text x="1092" y="476" text-anchor="middle" class="small">Expand curls; erode the heart</text>
<text x="1514" y="444" text-anchor="middle" class="label pink">EVAPORATE</text><text x="1514" y="476" text-anchor="middle" class="small">Fade opacity and emission to zero</text>

<rect x="56" y="528" width="614" height="350" rx="12" class="panel"/><text x="80" y="570" class="head">02 / SOFT ENVELOPE</text><text x="80" y="602" class="note">Hidden heart mask; no visible solid shell</text>
<g transform="translate(252 721) scale(.87)"><use href="#fog"/><use href="#heart" fill="none" stroke="#b289aa" stroke-width="1" stroke-dasharray="5 6" opacity=".5"/></g>
<path d="M164 814H340" class="rule" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="252" y="848" text-anchor="middle" class="label pink">0.90 m wide</text><text x="396" y="666" class="label">0.92 m high</text><text x="396" y="704" class="label">0.35 m deep</text><text x="396" y="750" class="note">Broad face in XZ</text><text x="396" y="780" class="note">Point down, travel −Y</text><text x="396" y="828" class="small">Visual scale, not collision size</text>

<rect x="690" y="528" width="1054" height="350" rx="12" class="panel"/><text x="714" y="570" class="head">03 / FOG LAYERS &amp; DENSITY</text><text x="714" y="610" class="label">Body: layered pink smoke + moving noise + heart-shaped mask</text><text x="714" y="648" class="label">Edge: wisps peel into world space; no continuous glowing rim</text><text x="714" y="686" class="label">Wake: broad pink mist streams, fading independently behind the heart</text><text x="714" y="731" class="note">Density scalar: 1.0 → 0.75 → 0.45 → 0 · Scale: 1.0 → 1.25</text><text x="714" y="762" class="small">Normalized authoring multipliers, not pixel opacity. Tune noise, layers and lighting together.</text>
<g transform="translate(714 795)"><rect width="128" height="24" fill="#c82777"/><rect x="140" width="128" height="24" fill="#f44c9d"/><rect x="280" width="128" height="24" fill="#ff82c2"/><rect x="420" width="128" height="24" fill="#ffc0df"/><rect x="560" width="128" height="24" fill="#ffe3f1"/><rect x="700" width="128" height="24" fill="#2b1738"/></g><text x="714" y="850" class="small">RASPBERRY → ROSE → PINK → BLUSH → PALE PINK → PLUM SHADOW</text>

<rect x="56" y="902" width="1688" height="188" rx="12" class="panel"/><text x="80" y="943" class="head">04 / CAST — 48 FRAMES</text><text x="1720" y="943" text-anchor="end" class="note">Right hand casts · left whip stays low · no root slide</text>
<path d="M80 965H1718" stroke="#f16aac" stroke-width="5"/>
<text x="80" y="1007" class="label pink">GATHER / F01–12</text><text x="80" y="1047" class="note">Small mouth-local wisp</text><text x="419" y="1007" class="label pink">KISS / F13–21</text><text x="419" y="1047" class="note">Pucker, focus, hold</text><text x="751" y="1007" class="label pink">RELEASE / F22</text><text x="751" y="1047" class="note">Detach at 0.70 s</text><text x="1080" y="1007" class="label pink">FOLLOW / F23–36</text><text x="1080" y="1047" class="note">Grow fog; open palm</text><text x="1424" y="1007" class="label pink">RECOVER / F37–48</text><text x="1424" y="1047" class="note">Fog continues independently</text>

<rect x="56" y="1114" width="820" height="204" rx="12" class="panel"/><text x="80" y="1156" class="head">05 / CONTACT DOES NOT CONSUME THE FOG</text><text x="80" y="1196" class="note">Apply enthrall once per eligible target per cast; deduplicate overlaps.</text><text x="80" y="1232" class="note">Brief pink veil on passage, then a small status-owned fog heart.</text><text x="80" y="1268" class="note">Resisted target: no sustained mark. Status expiry: fade its mark.</text>
<rect x="896" y="1114" width="848" height="204" rx="12" class="panel"/><text x="920" y="1156" class="head">06 / BOUNDED EVAPORATION</text><text x="920" y="1196" class="note">Fade beyond the target zone captured at release, including a miss.</text><text x="920" y="1232" class="note">Stop emission, finish detached wisps, then remove the projectile.</text><text x="920" y="1268" class="note">No age reset on contact; no endless chase of moving targets.</text>
<path d="M56 1344H1744" class="rule"/><text x="56" y="1375" class="small">EDITABLE SVG · Approved visual direction; scale and timing remain proposed. See the pink-fog Blender handoff for implementation details.</text><text x="1744" y="1375" text-anchor="end" class="small">MERIDIUS / 24 OCT 2026</text>
</svg>
